[project]
name = "bricklogger-ibos"
version = "0.1.1"
description = "Bricklogger source: the trend history of BACnet objects from the iBOS Data API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Rosenlund", email = "michael.rosenlund@cx1.dk" }]
requires-python = ">=3.11"
keywords = ["brick", "bacnet", "building-automation", "ibos", "bricklogger"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "bricklogger>=0.2,<0.3",
    "httpx>=0.27",
    # the engineering-unit numbers the API gives, by name
    "bacpypes3>=0.0.90",
]

[project.urls]
Homepage = "https://github.com/CX1-ApS/bricklogger-ibos"
Source = "https://github.com/CX1-ApS/bricklogger-ibos"
Issues = "https://github.com/CX1-ApS/bricklogger-ibos/issues"

[project.entry-points."bricklogger.sources"]
ibos = "bricklogger_ibos.declaration:SOURCE"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv.sources]
bricklogger = { path = "../bricklogger", editable = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bricklogger_ibos"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["bacpypes3.*", "rdflib.*", "pyshacl.*", "reasonable.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
